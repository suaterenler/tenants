name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Notify admin (building)
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}
        run: |
          [ -n "$RELEASE_SECRET" ] || exit 0
          for app in tenants; do
            curl -fsS -m 20 -X POST "https://app.erenleryazilim.com/admin/api/releases" \
              -H "Authorization: Bearer $RELEASE_SECRET" -H "Content-Type: application/json" \
              -d "{\"app\":\"$app\",\"status\":\"building\",\"commit\":\"${{ steps.ver.outputs.commit }}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || echo "admin bildirimi yapilamadi: $app"
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_COMMIT=${{ steps.ver.outputs.commit }}
            APP_BUILD_DATE=${{ steps.ver.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify admin
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}
        run: |
          [ -n "$RELEASE_SECRET" ] || { echo "::warning::RELEASE_SECRET tanimli degil; admin paneline bildirim gonderilemedi (panel bu derlemeyi gormez)"; exit 0; }
          for app in tenants; do
            curl -fsS -m 20 -X POST "https://app.erenleryazilim.com/admin/api/releases" \
              -H "Authorization: Bearer $RELEASE_SECRET" -H "Content-Type: application/json" \
              -d "{\"app\":\"$app\",\"commit\":\"${{ steps.ver.outputs.commit }}\",\"builtAt\":\"${{ steps.ver.outputs.date }}\"}" || echo "admin bildirimi yapilamadi: $app"
          done

      - name: Notify admin of failure
        if: failure()
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}
        run: |
          [ -n "$RELEASE_SECRET" ] || { echo "::warning::RELEASE_SECRET tanimli degil; admin paneline bildirim gonderilemedi (panel bu derlemeyi gormez)"; exit 0; }
          for app in tenants; do
            curl -fsS -m 20 -X POST "https://app.erenleryazilim.com/admin/api/releases"               -H "Authorization: Bearer $RELEASE_SECRET" -H "Content-Type: application/json"               -d "{\"app\":\"$app\",\"status\":\"failed\",\"commit\":\"${{ github.sha }}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || echo "admin bildirimi yapilamadi: $app"
          done
